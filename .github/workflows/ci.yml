name: ci
on:
  push: { branches: [main] }
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref == 'refs/heads/main' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  # Patched goose release from johnnymo87/goose tested by live-stub.
  # Keep in sync with workstation/pkgs/goose/default.nix (`tag = "patched-..."`).
  # To bump: check `gh release list --repo johnnymo87/goose`, update
  # GOOSE_RELEASE_TAG below, and confirm the live-stub job is green on the PR.
  GOOSE_RELEASE_TAG: patched-1.60.2.3

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace # live probes are #[ignore]d

  live-stub:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - name: Cache patched goose binary
        id: goose-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/honk-ci-goose
          key: goose-bin-${{ runner.os }}-${{ env.GOOSE_RELEASE_TAG }}
      - name: Download patched goose binary
        if: steps.goose-cache.outputs.cache-hit != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p "$HOME/.cache/honk-ci-goose"
          gh release download "$GOOSE_RELEASE_TAG" \
            --repo johnnymo87/goose \
            --pattern 'goose-x86_64-unknown-linux-gnu.tar.gz' \
            --dir "$HOME/.cache/honk-ci-goose"
          tar -xzf "$HOME/.cache/honk-ci-goose/goose-x86_64-unknown-linux-gnu.tar.gz" \
            -C "$HOME/.cache/honk-ci-goose"
          rm -f "$HOME/.cache/honk-ci-goose/goose-x86_64-unknown-linux-gnu.tar.gz"
          chmod +x "$HOME/.cache/honk-ci-goose/goose"
      - name: Configure goose binary
        run: |
          echo "HONK_GOOSE_BIN=$HOME/.cache/honk-ci-goose/goose" >> "$GITHUB_ENV"
          "$HOME/.cache/honk-ci-goose/goose" --version
      - run: cargo build -p honkd
      - run: echo "HONKD_BIN=$GITHUB_WORKSPACE/target/debug/honkd" >> "$GITHUB_ENV"
      - run: cargo test --workspace
